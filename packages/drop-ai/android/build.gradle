buildscript {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace "com.drop.ai"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1"

    // Native on-device OCR (offline) — ML Kit Text Recognition v2.
    implementation 'com.google.mlkit:text-recognition:16.0.1'

    // Optional system-AI adapters. Keep these commented out unless you publish
    // with them; the engine checks availability via reflection and degrades
    // gracefully when they are absent.
    //
    // Gemini Nano (ML Kit GenAI — Tier A on supported Android devices):
    //   implementation 'com.google.mlkit:genai-android:0.5.0'
    //
    // LiteRT-LM (Google AI Edge — Gemma 3n E2B local runtime — Tier B):
    //   implementation 'com.google.ai.edge.litert:litert-lm:1.0.0'
}
